# Uygulama yalnızca bu bilgisayardan erişilebilsin (demo şifreleri ortak; ağa/internete AÇMA)
[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

# Görünüm: açık tema, kurumsal lacivert ana renk (ui/streamlit_app.py içindeki CSS ile uyumlu)
[theme]
base = "light"
primaryColor = "#12355b"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#eef1f5"
textColor = "#1f2937"
baseRadius = "6px"

[client]
toolbarMode = "minimal"   # "Deploy" vb. geliştirici düğmeleri gizli
